<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Bundler — Empaquetador para IA</title>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- JSZip para descompresión de archivos .zip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter y JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Estilos CSS Locales -->
    <link rel="stylesheet" href="estilo/estilo.css">
</head>
<body x-data="empaquetadorApp()" x-init="inicializar()">

    <!-- Barra de Navegación -->
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-file-code text-white"></i>
                </div>
                <div>
                    <h1>AI Code Bundler</h1>
                    <p>Unifica tu repositorio en un único Markdown optimizado para IA</p>
                </div>
            </div>
            <div class="nav-actions">
                <button @click="cargarProyectoDemo()" class="btn-secondary">
                    <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
                    <span>Cargar Demo</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Zona Principal -->
    <main class="main-content">

        <!-- Barra de Importación -->
        <section class="card-import">
            <div class="import-glow"></div>
            
            <div class="import-header">
                <div class="space-y-1 text-center md:text-left">
                    <h2>
                        <i class="fa-solid fa-cloud-arrow-up text-indigo-400"></i>
                        <span>Importar Proyecto (Carpeta, ZIP o Archivos)</span>
                    </h2>
                    <p>Sube la carpeta de tu código fuente o un .zip para unificarlo ordenadamente.</p>
                </div>

                <div class="import-buttons">
                    <label class="btn-primary cursor-pointer">
                        <i class="fa-solid fa-folder-tree"></i>
                        <span>Subir Carpeta</span>
                        <input type="file" webkitdirectory directory multiple class="hidden" @change="manejarSeleccionCarpeta($event)">
                    </label>
                    <label class="btn-violet cursor-pointer">
                        <i class="fa-solid fa-file-zipper"></i>
                        <span>Subir .ZIP</span>
                        <input type="file" accept=".zip" class="hidden" @change="manejarSeleccionZip($event)">
                    </label>
                </div>
            </div>

            <!-- Zona Drag & Drop -->
            <div 
                @dragover.prevent="estaArrastrando = true" 
                @dragleave.prevent="estaArrastrando = false" 
                @drop.prevent="manejarSoltado($event)"
                :class="estaArrastrando ? 'dropzone active' : 'dropzone'">
                <div class="dropzone-icon">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </div>
                <p class="dropzone-text">Arrastra tu carpeta o archivo .zip aquí</p>
            </div>
        </section>

        <!-- Panel de Control y Vista de Archivos -->
        <template x-if="obtenerCantidadArchivos() > 0">
            <div class="app-grid">
                
                <!-- Columna Izquierda: Controles y Árbol -->
                <div class="panel-left">
                    <div class="panel-header">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-folder-open text-indigo-400"></i>
                            <h3>Archivos Detectados (<span x-text="obtenerCantidadArchivos()"></span>)</h3>
                        </div>
                        <button @click="limpiarTodo()" class="btn-text-rose">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>Limpiar</span>
                        </button>
                    </div>

                    <!-- Opciones de Generación para IA -->
                    <div class="options-box">
                        <h4>Opciones del Bundle</h4>
                        <label class="checkbox-label">
                            <input type="checkbox" x-model="opciones.excluirBinarios" class="checkbox-input">
                            <span>Excluir imágenes/binarios (Ahorra tokens)</span>
                        </label>
                    </div>

                    <!-- Botón Generar Bundle -->
                    <button @click="generarBundleParaIa()" class="btn-gradient">
                        <i class="fa-solid fa-file-lines"></i>
                        <span>Generar Bundle Markdown para IA</span>
                    </button>

                    <!-- Árbol Interactivo con Buscador -->
                    <div class="tree-container">
                        <div class="tree-header">
                            <span>Estructura</span>
                        </div>
                        <div class="search-box">
                            <i class="fa-solid fa-search search-icon"></i>
                            <input type="text" x-model="filtroArbol" placeholder="Buscar archivo..." class="search-input">
                        </div>

                        <div class="tree-list">
                            <template x-for="(nodo, ruta) in filtrarArbol()" :key="ruta">
                                <div class="tree-item group">
                                    <div class="tree-item-info" @click="seleccionarArchivo(ruta)">
                                        <i :class="obtenerIconoNodo(nodo)" class="shrink-0"></i>
                                        <span class="truncate" :class="archivoSeleccionado === ruta ? 'text-indigo-400 font-bold' : ''" x-text="ruta"></span>
                                    </div>
                                    <div class="tree-item-actions">
                                        <span class="text-xs text-slate-500" x-text="formatearBytes(nodo.tamano)"></span>
                                        <button @click="eliminarArchivo(ruta)" class="btn-delete"><i class="fa-solid fa-xmark"></i></button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Columna Derecha: Editor / Resultado Markdown / Logs -->
                <div class="panel-right">
                    
                    <!-- Pestañas de Navegación -->
                    <div class="tabs-bar">
                        <div class="tabs-group">
                            <button @click="pestanaActiva = 'bundle'" :class="pestanaActiva === 'bundle' ? 'tab-btn active' : 'tab-btn'">
                                <i class="fa-solid fa-file-arrow-down"></i>
                                <span>Bundle para IA (.md)</span>
                            </button>
                            <button @click="pestanaActiva = 'editor'" :class="pestanaActiva === 'editor' ? 'tab-btn active' : 'tab-btn'">
                                <i class="fa-solid fa-code"></i>
                                <span>Editor (<span x-text="archivoSeleccionado || 'Ninguno'"></span>)</span>
                            </button>
                            <button @click="pestanaActiva = 'registros'" :class="pestanaActiva === 'registros' ? 'tab-btn active' : 'tab-btn'">
                                <i class="fa-solid fa-terminal"></i>
                                <span>Registros</span>
                            </button>
                        </div>

                        <!-- Botones de Exportación -->
                        <template x-if="bundleAi">
                            <div class="flex items-center space-x-2">
                                <button @click="copiarCodigo()" class="btn-secondary">
                                    <i class="fa-solid fa-copy text-indigo-400"></i>
                                    <span x-text="copiado ? '¡Copiado!' : 'Copiar Markdown'"></span>
                                </button>
                                <button @click="descargarBundle()" class="btn-emerald">
                                    <i class="fa-solid fa-download"></i>
                                    <span>Descargar .md</span>
                                </button>
                            </div>
                        </template>
                    </div>

                    <!-- Contenido de las Pestañas -->
                    <div class="tab-content-container">
                        
                        <!-- Pestaña 1: Bundle Markdown para IA -->
                        <div x-show="pestanaActiva === 'bundle'" class="flex-1 flex flex-col gap-3 h-full">
                            <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                                <span x-text="bundleAi ? 'Tamaño del bundle: ' + formatearBytes(bundleAi.length) : 'Sin bundle generado'"></span>
                                <span class="text-slate-500">Formato listo para arrastrar y soltar en tu IA</span>
                            </div>
                            <div class="code-viewer">
                                <template x-if="!bundleAi">
                                    <div class="empty-state-inner">
                                        <i class="fa-solid fa-file-lines text-4xl text-slate-700"></i>
                                        <p class="text-sm text-slate-400">Haz clic en <strong class="text-indigo-400">"Generar Bundle Markdown para IA"</strong> para unificar tu código.</p>
                                    </div>
                                </template>
                                <textarea readonly x-model="bundleAi" class="code-textarea" placeholder="El código unificado aparecerá aquí..."></textarea>
                            </div>
                        </div>

                        <!-- Pestaña 2: Editor de Código -->
                        <div x-show="pestanaActiva === 'editor'" class="flex-1 flex flex-col gap-3 h-full">
                            <template x-if="!archivoSeleccionado">
                                <div class="empty-state-inner">
                                    <i class="fa-solid fa-file-code text-4xl text-slate-700"></i>
                                    <p class="text-sm text-slate-400">Selecciona un archivo del árbol de la izquierda para editarlo.</p>
                                </div>
                            </template>
                            <template x-if="archivoSeleccionado">
                                <div class="flex-1 flex flex-col gap-2 h-full">
                                    <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                                        <span class="font-mono text-indigo-400" x-text="archivoSeleccionado"></span>
                                        <button @click="guardarArchivoActual()" class="btn-primary text-xs py-1 px-3">Guardar Cambios</button>
                                    </div>
                                    <textarea x-model="contenidoEditor" class="code-textarea flex-1"></textarea>
                                </div>
                            </template>
                        </div>

                        <!-- Pestaña 3: Registros -->
                        <div x-show="pestanaActiva === 'registros'" class="flex-1 flex flex-col gap-3 h-full">
                            <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                                <span>Historial de Procesamiento</span>
                                <button @click="registros = []" class="text-slate-500 hover:text-slate-300 cursor-pointer">Limpiar</button>
                            </div>
                            <div class="logs-container">
                                <template x-for="reg in registros" :key="reg.id">
                                    <div class="log-item">
                                        <span class="text-slate-500 text-[10px]" x-text="reg.tiempo"></span>
                                        <span class="log-badge" x-text="reg.tipo"></span>
                                        <span class="text-slate-300 flex-1" x-text="reg.mensaje"></span>
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </template>

        <!-- Estado Vacío Inicial -->
        <template x-if="obtenerCantidadArchivos() === 0">
            <div class="empty-state-card">
                <div class="empty-icon-box">
                    <i class="fa-solid fa-laptop-code text-2xl"></i>
                </div>
                <div class="max-w-md space-y-1">
                    <h3 class="text-lg font-semibold text-white">Ningún proyecto cargado</h3>
                    <p class="text-sm text-slate-400">
                        Sube tu carpeta de código o haz clic en <button @click="cargarProyectoDemo()" class="text-indigo-400 underline hover:text-indigo-300 cursor-pointer">Cargar Demo</button> para probar.
                    </p>
                </div>
            </div>
        </template>

    </main>

    <!-- Script JS externo -->
    <script src="js/app.js"></script>
</body>
</html>
